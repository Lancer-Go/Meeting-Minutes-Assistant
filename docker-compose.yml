services:
  mma:
    build: .
    ports:
      - "8000:8000"
    environment:
      # ASR / LLM 主选（M0 锁定：腾讯云 16k_zh / DeepSeek-V4 Pro）
      MMA_ASR: tencent
      MMA_LLM: deepseek
      MMA_DATA_DIR: /data
    env_file:
      - .env            # 云密钥（.gitignore，不提交）
    volumes:
      - mma-data:/data  # 上传文件 + 任务产物 + SQLite

volumes:
  mma-data:
