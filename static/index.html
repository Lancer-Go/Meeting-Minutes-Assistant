<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会议纪要助手</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --fg: #1f2328; --muted: #6b7280;
    --accent: #2563eb; --border: #e5e7eb; --ok: #16a34a; --err: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--fg); }
  main { max-width: 640px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .upload { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  input[type=file] { flex: 1; min-width: 220px; padding: 10px; background: var(--card);
                     border: 1px dashed var(--border); border-radius: 8px; }
  button { padding: 10px 18px; border: none; border-radius: 8px; background: var(--accent);
           color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-size: 14px; color: var(--muted); margin: 12px 0; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .progress { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .progress .bar { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .result { margin-top: 16px; padding: 14px; background: var(--card);
            border: 1px solid var(--border); border-radius: 8px; }
  .result a { display: inline-block; margin-right: 14px; color: var(--accent); text-decoration: none; }
  .result a:hover { text-decoration: underline; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  ul { list-style: none; padding: 0; }
  li { padding: 10px 12px; background: var(--card); border: 1px solid var(--border);
       border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; margin-left: 6px; }
  .tag.pending { background: #fef3c7; color: #92400e; }
  .tag.running { background: #dbeafe; color: #1d4ed8; }
  .tag.succeeded { background: #dcfce7; color: #166534; }
  .tag.failed { background: #fee2e2; color: #991b1b; }
  .hidden { display: none; }
  .authbar { text-align: right; font-size: 13px; margin-bottom: 8px; }
  .authbar a { color: var(--accent); text-decoration: none; margin-left: 12px; }
  .authbar span { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="authbar" id="authbar">
    <span id="whoami"></span>
    <a href="/login.html" id="loginLink">登录</a>
    <a href="/register.html" id="regLink">注册</a>
    <a href="javascript:logout()" id="logoutLink" class="hidden">登出</a>
  </div>
  <h1>会议纪要助手</h1>
  <p class="sub">上传会议录音/录像（MP4 / MKV / WAV / MP3 / M4A，≤ 2 小时），自动生成结构化 Markdown 纪要</p>

  <div class="upload">
    <input type="file" id="file" accept=".mp4,.mkv,.wav,.mp3,.m4a">
    <button id="uploadBtn">上传并生成纪要</button>
  </div>

  <div id="status" class="status hidden"></div>
  <div class="progress hidden" id="progressWrap"><div class="bar" id="bar"></div></div>
  <div id="result" class="result hidden"></div>

  <h2>任务历史</h2>
  <ul id="history"></ul>

  <h2>纪要检索</h2>
  <input type="search" id="search" placeholder="按关键词 / 主题搜索历史纪要…" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--card);">
  <ul id="searchResults" style="margin-top:8px;"></ul>

  <h2>智能问答（RAG）</h2>
  <div class="upload">
    <input type="text" id="qaInput" placeholder="例：上次会议谁负责跟进客户需求？" style="flex:1;min-width:220px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--card);">
    <button id="qaBtn">提问</button>
  </div>
  <div id="qaResult" class="result hidden" style="white-space:pre-wrap;"></div>
</main>

<script src="/static/auth.js"></script>
<script>
const STATUS_TEXT = { pending: '排队中', running: '处理中', succeeded: '已完成', failed: '失败' };

const $ = (id) => document.getElementById(id);

// 登录态展示
(function initAuthBar() {
  if (isLoggedIn()) {
    $('whoami').textContent = '已登录';
    $('loginLink').classList.add('hidden');
    $('regLink').classList.add('hidden');
    $('logoutLink').classList.remove('hidden');
  }
})();

function setStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = 'status ' + (cls || '');
  if (cls) { el.classList.remove('hidden'); } else { el.classList.add('hidden'); }
}

async function upload() {
  const fileInput = $('file');
  if (!fileInput.files.length) { setStatus('请先选择文件', 'err'); return; }
  const file = fileInput.files[0];
  const btn = $('uploadBtn');
  btn.disabled = true;
  $('result').classList.add('hidden');
  $('progressWrap').classList.remove('hidden');
  $('bar').style.width = '0%';
  setStatus('上传中…');

  const form = new FormData();
  form.append('file', file);
  try {
    const resp = await apiFetch('/api/tasks', { method: 'POST', body: form });
    const data = await resp.json();
    if (!resp.ok) { setStatus('上传失败：' + (data.detail || resp.status), 'err'); return; }
    poll(data.id);
  } catch (e) {
    setStatus('上传失败：' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function poll(id) {
  const timer = setInterval(async () => {
    try {
      const resp = await apiFetch('/api/tasks/' + id);
      const t = await resp.json();
      const pmsg = t.progress_message ? ` — ${t.progress_message}` : '';
      setStatus(`${STATUS_TEXT[t.status] || t.status}（${Math.round(t.progress || 0)}%）${pmsg}`);
      $('bar').style.width = (t.progress || 0) + '%';
      if (t.status === 'succeeded') {
        clearInterval(timer);
        showResult(id, null);
        loadHistory();
      } else if (t.status === 'failed') {
        clearInterval(timer);
        setStatus('处理失败：' + (t.error || '未知错误'), 'err');
        $('progressWrap').classList.add('hidden');
        loadHistory();
      }
    } catch (e) { /* 网络抖动，继续轮询 */ }
  }, 1500);
}

function showResult(id) {
  const el = $('result');
  el.innerHTML = '<b>✅ 纪要已生成</b><br><br>' +
    '<a href="javascript:downloadFile(\'/api/tasks/' + id + '/minute\', \'minutes.md\')">📄 下载纪要 (Markdown)</a>' +
    '<a href="javascript:downloadFile(\'/api/tasks/' + id + '/transcript\', \'transcript.txt\')">📝 下载转写文本</a>';
  el.classList.remove('hidden');
  setStatus('已完成', 'ok');
  $('progressWrap').classList.add('hidden');
}

async function loadHistory() {
  try {
    const resp = await apiFetch('/api/tasks');
    const tasks = await resp.json();
    const ul = $('history');
    ul.innerHTML = '';
    tasks.slice(0, 20).forEach((t) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${escapeHtml(t.source_file)}</span>` +
        `<span class="tag ${t.status}">${STATUS_TEXT[t.status] || t.status}</span>` +
        (t.status === 'succeeded'
          ? ` <a href="javascript:downloadFile('/api/tasks/${t.id}/minute', 'minutes.md')">下载</a> <a href="/minute.html?id=${t.id}">编辑</a>`
          : '');
      ul.appendChild(li);
    });
  } catch (e) { /* 忽略 */ }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function searchMinutes(q) {
  const ul = $('searchResults');
  if (!q) { ul.innerHTML = ''; return; }
  try {
    const resp = await apiFetch('/api/minutes?q=' + encodeURIComponent(q));
    const rows = await resp.json();
    ul.innerHTML = '';
    if (!rows.length) {
      const li = document.createElement('li');
      li.textContent = '无匹配纪要';
      ul.appendChild(li);
      return;
    }
    rows.forEach((m) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${escapeHtml(m.title || m.task_id)}</span>` +
        `<span class="tag succeeded">${escapeHtml(m.template || 'standard')}</span>` +
        ` <a href="/minute.html?id=${m.task_id}">打开</a>` +
        `<br><small style="color:var(--muted)">更新于 ${escapeHtml(m.updated_at || '')}</small>`;
      ul.appendChild(li);
    });
  } catch (e) { /* 忽略 */ }
}

$('search').addEventListener('input', (e) => searchMinutes(e.target.value));
$('uploadBtn').addEventListener('click', upload);
loadHistory();

// M4 · 智能问答（RAG）
async function ask() {
  const q = $('qaInput').value.trim();
  if (!q) return;
  const btn = $('qaBtn');
  const el = $('qaResult');
  btn.disabled = true;
  try {
    const resp = await apiFetch('/api/qa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    const data = await resp.json();
    if (!resp.ok) {
      el.innerHTML = '<b>❌ ' + escapeHtml(data.detail || '提问失败') + '</b>';
    } else {
      const src = (data.sources || []).map((s) =>
        `<li><a href="/minute.html?id=${s.task_id}">${escapeHtml(s.title || s.task_id)}</a>` +
        (s.similarity != null ? `<span class="tag succeeded">相似度 ${s.similarity}</span>` : '') +
        `<br><small style="color:var(--muted)">${escapeHtml(s.snippet || '')}</small></li>`
      ).join('');
      el.innerHTML = '<b>💬 回答</b>' +
        (data.degraded ? ' <small style="color:var(--muted)">（已降级为关键词检索）</small>' : '') +
        '<div style="margin:8px 0">' + escapeHtml(data.answer || '') + '</div>' +
        '<b>来源</b><ul>' + (src || '<li>无</li>') + '</ul>';
    }
    el.classList.remove('hidden');
  } catch (e) {
    el.innerHTML = '提问失败：' + escapeHtml(e.message);
    el.classList.remove('hidden');
  } finally {
    btn.disabled = false;
  }
}

$('qaBtn').addEventListener('click', ask);
$('qaInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
