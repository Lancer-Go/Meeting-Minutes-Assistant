<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纪要编辑</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --fg: #1f2328; --muted: #6b7280;
    --accent: #2563eb; --border: #e5e7eb; --ok: #16a34a; --err: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--fg); }
  main { max-width: 860px; margin: 32px auto; padding: 0 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 13px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; }
  button { padding: 9px 16px; border: none; border-radius: 8px; background: var(--accent);
           color: #fff; font-size: 14px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  textarea { width: 100%; height: 60vh; padding: 14px; font-family: ui-monospace, "SF Mono", Consolas, monospace;
             font-size: 13px; line-height: 1.6; border: 1px solid var(--border); border-radius: 8px;
             background: var(--card); color: var(--fg); resize: vertical; }
  .status { font-size: 14px; margin: 10px 0; color: var(--muted); }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  h2 { font-size: 16px; margin: 24px 0 10px; }
  ul { list-style: none; padding: 0; }
  li { padding: 10px 12px; background: var(--card); border: 1px solid var(--border);
       border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
  .cmt-meta { color: var(--muted); font-size: 12px; }
  .cmt-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .cmt-form input[type=text] { flex: 1; min-width: 160px; padding: 9px; border: 1px solid var(--border);
                              border-radius: 8px; background: var(--card); }
  .del { color: var(--err); cursor: pointer; margin-left: 8px; }
</style>
</head>
<body>
<main>
  <h1>纪要编辑</h1>
  <p class="sub" id="sub"></p>

  <div class="toolbar">
    <button id="saveBtn">保存</button>
    <button class="ghost" id="reloadBtn">放弃修改</button>
    <a href="/"><button class="ghost" type="button">← 返回</button></a>
  </div>
  <div id="status" class="status hidden"></div>
  <textarea id="editor" placeholder="加载中…"></textarea>

  <h2>批注</h2>
  <div class="cmt-form">
    <input type="text" id="cmtAuthor" placeholder="署名（可选）">
    <input type="text" id="cmtText" placeholder="批注内容">
    <button id="addCmt">添加批注</button>
  </div>
  <ul id="comments"></ul>
</main>

<script src="/static/auth.js"></script>
<script>
const taskId = new URLSearchParams(location.search).get('id');
const $ = (id) => document.getElementById(id);

function setStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = 'status ' + (cls || '');
  el.classList.remove('hidden');
}

async function loadMinute() {
  try {
    const resp = await apiFetch('/api/tasks/' + taskId + '/minute');
    if (!resp.ok) { setStatus('加载失败：' + resp.status, 'err'); return; }
    $('editor').value = await resp.text();
    $('sub').textContent = '任务 ' + taskId;
  } catch (e) { setStatus('加载失败：' + e.message, 'err'); }
}

async function save() {
  const markdown = $('editor').value;
  try {
    const resp = await apiFetch('/api/tasks/' + taskId + '/minute', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ markdown: markdown }),
    });
    const data = await resp.json();
    if (!resp.ok) { setStatus('保存失败：' + (data.detail || resp.status), 'err'); return; }
    setStatus('✅ 已保存', 'ok');
  } catch (e) { setStatus('保存失败：' + e.message, 'err'); }
}

async function loadComments() {
  try {
    const resp = await apiFetch('/api/tasks/' + taskId + '/comments');
    const rows = await resp.json();
    const ul = $('comments');
    ul.innerHTML = '';
    if (!rows.length) {
      const li = document.createElement('li');
      li.textContent = '暂无批注';
      ul.appendChild(li);
      return;
    }
    rows.forEach((c) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${escapeHtml(c.text)}</span>` +
        `<span class="cmt-meta"> — ${escapeHtml(c.author || '匿名')} · ${escapeHtml(c.created_at || '')}</span>` +
        `<span class="del" data-id="${c.id}">删除</span>`;
      ul.appendChild(li);
    });
  } catch (e) { /* 忽略 */ }
}

async function addComment() {
  const text = $('cmtText').value.trim();
  if (!text) return;
  const author = $('cmtAuthor').value.trim();
  try {
    const resp = await apiFetch('/api/tasks/' + taskId + '/comments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, author: author }),
    });
    if (!resp.ok) { setStatus('批注失败', 'err'); return; }
    $('cmtText').value = '';
    loadComments();
  } catch (e) { setStatus('批注失败：' + e.message, 'err'); }
}

async function delComment(id) {
  try {
    await apiFetch('/api/tasks/' + taskId + '/comments/' + id, { method: 'DELETE' });
    loadComments();
  } catch (e) { /* 忽略 */ }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

$('saveBtn').addEventListener('click', save);
$('reloadBtn').addEventListener('click', loadMinute);
$('addCmt').addEventListener('click', addComment);
$('comments').addEventListener('click', (e) => {
  if (e.target.classList.contains('del')) delComment(e.target.dataset.id);
});

if (!taskId) {
  setStatus('缺少任务 ID', 'err');
} else {
  loadMinute();
  loadComments();
}
</script>
</body>
</html>
