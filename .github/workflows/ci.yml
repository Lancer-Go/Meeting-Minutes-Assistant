name: CI

# M3 TG-1：lint → test → build → GHCR 镜像发布
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check app tests
      - name: Compile check
        run: python -m compileall -q app

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Pytest with coverage (≥70%)
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=70

  build:
    name: Build & publish image
    runs-on: ubuntu-latest
    needs: [lint, test]
    # 仅 main / tag 推送时发布镜像，避免每个 PR 都推 GHCR
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mma:latest
            ghcr.io/${{ github.repository_owner }}/mma:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
